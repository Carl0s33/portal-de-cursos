<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Conheça os cursos, disciplinas, professores e produções acadêmicas dos estudantes no Portal de Cursos."
    />
    <meta name="theme-color" content="#0046d2" />
    <link rel="icon" type="image/png" href="%BASE_URL%logo-portal.png" />
    <meta property="og:title" content="Portal de Cursos" />
    <meta
      property="og:description"
      content="Cursos, disciplinas, professores e produções acadêmicas."
    />
    <meta property="og:type" content="website" />
    <title>Portal de Cursos — Formação e produção acadêmica</title>
    <script>
      try {
        var t = localStorage.getItem('portal-cursos-tema')
        if (t !== 'claro' && t !== 'escuro')
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro'
        document.documentElement.dataset.tema = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
